name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Korean and English copy
        run: node scripts/check-copy.mjs
      - name: Build output covers the service worker app shell
        run: |
          npm run build
          node -e "
            const fs = require('fs');
            const sw = fs.readFileSync('sw.js', 'utf8');
            const list = sw.match(/APP_SHELL = \[([\s\S]*?)\]/)[1];
            const missing = (list.match(/\"([^\"]+)\"/g) || [])
              .map((item) => item.slice(1, -1))
              .filter((file) => file !== './' && !fs.existsSync('dist/' + file));
            if (missing.length) { console.error('dist에 없는 앱 셸 파일: ' + missing.join(', ')); process.exit(1); }
          "
      - name: Cache version is bumped when app shell changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "비교할 기준 커밋이 없어 건너뜁니다."
            exit 0
          fi
          shell='^(index\.html|styles\.css|app\.js|manifest\.webmanifest|favicon\.svg|icons/)'
          changed="$(git diff --name-only "$BASE_SHA" HEAD | grep -E "$shell" || true)"
          if [[ -n "$changed" ]] && ! git diff "$BASE_SHA" HEAD -- sw.js | grep -qE '^[+-].*CACHE_NAME'; then
            echo "앱 셸 파일이 바뀌었지만 sw.js의 CACHE_NAME이 그대로입니다:"
            echo "$changed"
            exit 1
          fi
      - name: Whitespace and newline errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Commit message format
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            range=("$AFTER_SHA" -1)
          else
            range=("$BEFORE_SHA..$AFTER_SHA")
          fi
          # 봇(Dependabot 등)이 만든 커밋 제목은 언어 선언의 예외다.
          subjects="$(git log --no-merges --format='%an%x09%s' "${range[@]}" |
            awk -F'\t' '$1 !~ /\[bot\]$/ { sub(/^[^\t]*\t/, ""); print }')"
          [[ -n "$subjects" ]] || exit 0
          message="$(mktemp)"
          trap 'rm -f "$message"' EXIT
          while IFS= read -r subject; do
            case "$subject" in
              'Merge '*|'Revert "'*|'fixup! '*|'squash! '*|'amend! '*)
                echo "main 커밋 제목은 정식 제목 형식을 사용합니다: $subject"
                exit 1
                ;;
            esac
            printf '%s\n' "$subject" > "$message"
            .githooks/commit-msg "$message"
            if [[ "$(cat "$message")" != "$subject" ]]; then
              echo "커밋 제목에 AI 생성 표식을 넣을 수 없습니다."
              exit 1
            fi
          done <<< "$subjects"
