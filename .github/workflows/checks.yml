name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Whitespace and newline errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Commit message format
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert): .+'
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$AFTER_SHA -1"
          else
            range="$BEFORE_SHA..$AFTER_SHA"
          fi
          invalid="$(git log --no-merges --format='%s' $range | grep -Ev "$pattern" || true)"
          if [[ -n "$invalid" ]]; then
            echo "다음 커밋 제목이 규칙과 맞지 않습니다:"
            echo "$invalid"
            exit 1
          fi
